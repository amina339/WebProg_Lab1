<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Магазин игрушек — Mina</title>
  <!-- подключение стилей -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/blocks_positions.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="icon" type="image/png" href="images/favicon.png">
</head>
<div class="toast" id="toast"></div>
<body>

  <!-- шапка сайта, остаётся сверху при прокрутке -->
  <header class="header">
    <div class="container header__inner">
      <!-- логотип и ссылка на главную -->
      <div href="/" class="logo">🧸 Mina</div>
      <!-- кнопка корзины -->
      <button class="cart-button" id="cartButton" type="button" aria-label="Открыть корзину">
        <svg class="cart-button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="cart-button__count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <main class="container main">

    <!-- каталог товаров -->
    <section class="catalog" aria-labelledby="catalogTitle">
      <h1 class="catalog__title" id="catalogTitle">Каталог игрушек</h1>

      <!-- карточки товаров -->
      <div class="products" id="products"></div>
    </section>

  </main>

  <dialog class="modal" id="orderModal">
    <form class="order-form" id="orderForm" method="dialog">
      <h2 class="order-form__title">Оформление заказа</h2>

      <!-- поля формы, все обязательные -->
      <label class="order-form__field">
        <span>Имя</span>
        <input type="text" name="firstName" required>
      </label>

      <label class="order-form__field">
        <span>Фамилия</span>
        <input type="text" name="lastName" required>
      </label>

      <label class="order-form__field">
        <span>Адрес доставки</span>
        <input type="text" name="address" required>
      </label>

      <label class="order-form__field">
        <span>Контактный телефон</span>
        <input type="tel" name="phone" required>
      </label>

       <!-- кнопки внизу формы -->
      <div class="order-form__actions">
        <button type="button" class="btn btn--ghost" id="cancelOrder">
          Отмена
        </button>
        <button type="submit" class="btn btn--primary">
          Создать заказ
        </button>
      </div>
    </form>
  </dialog>

  <!-- модалка корзины -->
  <dialog class="modal cart-modal" id="cartModal">
    <h2 class="modal__title">Корзина</h2>
    <ul class="cart__list" id="cartList"></ul>
    <p class="cart__total">
      Итого: <span id="cartTotal">0</span> ₽
    </p>
    <div class="modal__actions">
      <button type="button" class="btn" id="closeCart">Закрыть</button>
      <button type="button" class="order-btn" id="checkoutButton">Оформить заказ</button>
    </div>
  </dialog>

  <!-- нижняя надпись о компании -->
  <footer class="footer">
    <div class="container">
      <p>© 2026 Магазин игрушек Mina</p>
    </div>
  </footer>

  <!-- подключение js в самом конце, после загрузки html -->
  <script src="js/data.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
